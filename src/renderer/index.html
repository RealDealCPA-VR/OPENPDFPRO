<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Open PDF Pro</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <div id="toolbar">
    <button id="btn-open">Open…</button>
    <button id="btn-save">Save</button>
    <span id="doc-name"></span>
    <span class="spacer"></span>
    <button id="btn-prev">◀</button>
    <span id="page-indicator">0 / 0</span>
    <button id="btn-next">▶</button>
    <button id="btn-zoom-out">−</button>
    <span id="zoom-label">100%</span>
    <button id="btn-zoom-in">+</button>
    <button id="btn-rotate">⟳</button>
    <input id="search-input" placeholder="Search…" />
    <span id="search-count"></span>
    <span class="spacer"></span>
    <button id="btn-ocr" title="OCR current page: add searchable text layer">OCR</button>
    <button id="btn-verify-sig" title="Verify digital signatures">Signatures</button>
    <button id="btn-redact" title="Redact region (x,y,w,h in PDF points)">Redact</button>
    <button id="btn-freetext" title="Add free text">Text</button>
    <button id="btn-rect" title="Add rectangle annotation">Rect</button>
    <button id="btn-flatten" title="Flatten form">Flatten</button>
    <button id="btn-delete-page" title="Delete current page">Del</button>
    <button id="btn-extract" title="Extract page range to new PDF">Extract</button>
    <button id="btn-merge" title="Merge another PDF after this one">Merge</button>
    <button id="btn-split" title="Split to single-page PDFs in folder">Split</button>
    <button id="btn-reorder" title="Reorder (comma-separated new order)">Reorder</button>
    <button id="btn-compress" title="Compress">Compress</button>
    <button id="btn-export-png" title="Export current page as PNG">PNG</button>
  </div>
  <div id="main">
    <div id="sidebar"></div>
    <div id="viewer"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
